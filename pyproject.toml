[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chromhydra"
version = "0.1.0"
description = "SeleniumBase CDP Mode with real Client Hints and a fingerprint leak doctor."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Naimur Hasan" }]
requires-python = ">=3.10"
dependencies = ["seleniumbase>=4.56,<5"]
keywords = ["seleniumbase", "cdp", "client-hints", "fingerprint", "browser-automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
chromhydra = "chromhydra.cli:main"

[project.urls]
Homepage = "https://github.com/naimurhasan/chromhydra"

[tool.setuptools.packages.find]
include = ["chromhydra*"]

[tool.setuptools.package-data]
"chromhydra.doctor" = ["probe.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:seleniumbase -m 'not browser'"
markers = ["browser: launches a real Chrome"]
filterwarnings = ["ignore::DeprecationWarning:seleniumbase.*"]

[tool.ruff]
line-length = 130
lint.select = ["E4", "E7", "E9", "F", "I"]
